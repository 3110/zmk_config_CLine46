; CLine46 ステータスモニタ（シリアル出力）の PlatformIO プロジェクト。
;
; 機種ごとの設定は submodule の共通 ini に任せている。
; 初回だけ submodule を取ってくること:
;   git submodule update --init tools/m5stack-status-monitor/config
;
; ビルドと書き込み:
;   pio run -e m5stack-stop-watch
;   pio run -e m5stack-stop-watch -t upload -t monitor
;
; 表示は含めていない（シリアルに出すだけ）。画面に出す場合は
; ../CLine46Status のライブラリを使って自分のスケッチを書く。

[platformio]
extra_configs =
    ../config/platformio-m5stack.ini
src_dir = src

; 共通 ini の [env] が platform / framework / board_build.* を持っている。
; こちらはプロジェクト固有の分だけを足す（機種セクションが
; ${env.build_flags} と ${env.lib_deps} を参照するので、空でも定義は必要）
[env]
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
    ; 起動時のログを減らす（広告の表示だけ見たいため）
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    ; 同じリポジトリ内のライブラリ（tools/CLine46Status）
    symlink://../CLine46Status

; ---- 機種ごとの env。共通 ini のセクションを extends するだけ ----
; 他の機種を使う場合は config/platformio-m5stack.ini にある
; セクション名（m5stack-cardputer、m5stack-dial など）を同じ形で足す

[env:m5stack-stop-watch]
extends = m5stack-stop-watch

[env:m5stack-basic-4MB]
extends = m5stack-basic-4MB

[env:m5stack-core2]
extends = m5stack-core2

[env:m5stack-cores3]
extends = m5stack-cores3

[env:m5stick-c]
extends = m5stick-c

[env:m5stick-c-plus2]
extends = m5stick-c-plus2

[env:m5stack-atoms3]
extends = m5stack-atoms3
