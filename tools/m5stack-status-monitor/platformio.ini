; PlatformIO でビルドする場合の設定。このフォルダをプロジェクトとして開く。
; Arduino IDE を使う場合はこのファイルは不要（README 参照）。
[platformio]
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.5.1

; 使っている機種の env を指定してビルドする
; 例: pio run -e m5stick-c -t upload -t monitor
[env:m5stack-core-esp32]
board = m5stack-core-esp32

[env:m5stack-core2]
board = m5stack-core2

[env:m5stick-c]
board = m5stick-c

[env:m5stack-atom]
board = m5stack-atom

; S3 系はシリアルが USB CDC なので、有効にしておく
[env:m5stack-atoms3]
board = m5stack-atoms3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:m5stack-cores3]
board = m5stack-cores3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
