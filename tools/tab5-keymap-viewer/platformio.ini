; CLine46 キーマップビューワー（M5Stack Tab5）の PlatformIO プロジェクト。
;
; キーボードの右手が流している状態広告（docs/status-advertisement.md）を
; Tab5 で受けて、今のレイヤーのキーマップを画面いっぱいに描く。
; 接続もペアリングもしないので、PC との接続や DYA Studio には影響しない。
;
; 機種ごとの設定は submodule の共通 ini に任せている。
; 初回だけ submodule を取ってくること:
;   git submodule update --init tools/config
;
; ビルドと書き込み:
;   pio run -e m5stack-tab5 -t upload -t monitor

[platformio]
extra_configs =
    ../config/platformio-m5stack.ini
src_dir = src

[env]
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0

; 共通 ini の機種セクションと m5unified セクションを両方取り込む。
; extends は同じキーを上書きするので、build_flags と lib_deps は明示的に足す。
;
; Tab5（ESP32-P4）は BLE を無線用の ESP32-C6 に任せていて、NimBLE-Arduino が
; まだ対応していない（2.5.1 はビルドが通らない）。CLine46Status は P4 では
; Arduino コア内蔵の BLE ライブラリを使うので、NimBLE-Arduino は入れない。
; CLine46Status は #if で使うライブラリを選ぶので、LDF が同じ判断をできるよう
; 選択のマクロを build_flags で渡し、#if を評価する chain+ にする
; （P4 の判定に使う CONFIG_IDF_TARGET_ESP32P4 は LDF からは見えない）
[env:m5stack-tab5]
extends = m5stack-tab5, m5unified
lib_ldf_mode = chain+
; 共通 ini の Tab5 は ESP32-P4 の評価ボードの定義を借りているため、ピン定義
; （variant）が評価ボードのものになる。BLE を担う ESP32-C6 とつなぐ SDIO の
; ピンは variant で決まり、評価ボードのままでは C6 と話せないので Tab5 のものにする
board_build.variant = m5stack_tab5
; 日本語フォントで 2.7MB ほどになり、既定の 1.3MB の領域に入らない。
; Tab5 のフラッシュ 16MB に合わせた分割にする
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    ${m5stack-tab5.build_flags}
    ${m5unified.build_flags}
    -DCLINE46_STATUS_USE_ARDUINO_BLE
lib_deps =
    symlink://../CLine46Status
    ${m5unified.lib_deps}
