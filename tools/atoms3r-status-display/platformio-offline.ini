; PlatformIO レジストリに出られないネットワークでビルドするための上書き設定。
;
; platformio.ini はそのままで、こちらを -c で指して使う:
;   bash ../pio-setup-no-registry.sh
;   source "$HOME/.platformio/pio-env.sh"
;   pio run -c platformio-offline.ini -e m5stack-atoms3r
;
; 違いは3点だけ:
;   - platform を pioarduino 版にする（GitHub Releases だけでパッケージが揃う）
;   - platform_packages を空にする（レジストリ指定を打ち消す）
;   - lib_deps をレジストリ名ではなく git URL + タグ直指定にする
;     （レジストリが引けないので ^ のバージョン解決ができない）
;
; 詳しい背景は docs/platformio-without-registry.md を参照。

[platformio]
extra_configs =
    ../config/platformio-m5stack.ini
src_dir = src

[env]
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.1
    ; 同じリポジトリ内のライブラリ（tools/CLine46Status）
    symlink://../CLine46Status

[env:m5stack-atoms3r]
extends = m5stack-atoms3r, m5unified
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
platform_packages =
build_flags =
    ${m5stack-atoms3r.build_flags}
    ${m5unified.build_flags}
lib_deps =
    ${env.lib_deps}
    https://github.com/m5stack/M5GFX.git#0.2.29
    https://github.com/m5stack/M5Unified.git#0.2.22

[env:m5stack-atoms3]
extends = m5stack-atoms3, m5unified
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
platform_packages =
build_flags =
    ${m5stack-atoms3.build_flags}
    ${m5unified.build_flags}
lib_deps =
    ${env.lib_deps}
    https://github.com/m5stack/M5GFX.git#0.2.29
    https://github.com/m5stack/M5Unified.git#0.2.22
