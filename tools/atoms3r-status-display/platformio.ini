; CLine46 ステータス表示（M5AtomS3R / AtomS3）の PlatformIO プロジェクト。
;
; 機種ごとの設定は submodule の共通 ini に任せている。
; 初回だけ submodule を取ってくること:
;   git submodule update --init tools/config
;
; ビルドと書き込み:
;   pio run -e m5stack-atoms3r -t upload -t monitor
;
; 画面の中身は ../CLine46Status/examples/AtomS3RHome/AtomS3RHome.ino
; （Arduino IDE 用のサンプルと同じものを使っている）

[platformio]
extra_configs =
    ../config/platformio-m5stack.ini
src_dir = src

[env]
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    ; 同じリポジトリ内のライブラリ（tools/CLine46Status）
    symlink://../CLine46Status

; 共通 ini の機種セクションと m5unified セクションを両方取り込む。
; extends は同じキーを上書きするので、build_flags と lib_deps は明示的に足す
[env:m5stack-atoms3r]
extends = m5stack-atoms3r, m5unified
build_flags =
    ${m5stack-atoms3r.build_flags}
    ${m5unified.build_flags}
lib_deps =
    ${env.lib_deps}
    ${m5unified.lib_deps}

[env:m5stack-atoms3]
extends = m5stack-atoms3, m5unified
build_flags =
    ${m5stack-atoms3.build_flags}
    ${m5unified.build_flags}
lib_deps =
    ${env.lib_deps}
    ${m5unified.lib_deps}
