manifest:
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: badjeff    # <-- PMW3610
      url-base: https://github.com/badjeff
    - name: caksoylar  # <-- RGB LED
      url-base: https://github.com/caksoylar
    - name: takamaru-fpv  # <-- Battery level smoothing
      url-base: https://github.com/takamaru-fpv

  projects:
    # ZMK: DYA Studio 用カスタム RPC サブシステム付き cormoran fork。
    # v0.3 系ではマクロ/コンボのモジュールが Zephyr 3.7 以降の書き方
    # (configdefault / ROM_SECTIONS)を使っていて通らなかったため、
    # main+dya(Zephyr v4.1.0+zmk-fixes)に移行した。
    # Zephyr は ZMK 側の app/west.yml から入るのでここで指定しない
    - name: zmk
      remote: cormoran
      # main+dya @ 2026-07-25 (Zephyr v4.1.0+zmk-fixes)
      revision: e5c9b6915b56801193e359dd9bad4a167ce0d1b8
      import: app/west.yml
    - name: zmk-feature-non-lipo-battery-management
      remote: takamaru-fpv
      revision: voltage_division

    # DYA Studio モジュール（すべて cormoran リポジトリ）。
    # main 追従で breaking change の実績があるため、タグのあるもの以外は
    # コミット SHA で固定する
    - name: zmk-module-ble-management
      remote: cormoran
      # main @ 2026-07-05 (このモジュールには zmk-v0.4.0.0 タグが未発行)
      revision: 57738cc4fc6ba80e82a7ac57741a0339cb186cd4
    - name: zmk-module-battery-history
      remote: cormoran
      # main @ 2026-02-24 (タグ無し)
      revision: 307755dd2ad4d320e14de162e8e5ef018f29d929
    - name: zmk-module-settings-rpc
      remote: cormoran
      # main @ 2026-07-06 (このモジュールには zmk-v0.4.0.0 タグが未発行)
      revision: 78f86df9e6c5edaf57bef3ccbd7f360cfdf49291
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: zmk-v0.4.0.0

    # マクロ/コンボを DYA Studio から編集するためのモジュール。
    # zmk-feature-custom-settings は他 2 つの依存
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: c6a7fef3a3be3d3ace5de9a4b0628c6418cd1f3f
    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: 38530962eb7061b60efcb98e84585cfb1f0cb6de
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: d9490e7b5d41c516221d131241009e81740efcee

    # 切り分け用のモジュール。押下キーの可視化とハード診断で、
    # 「押したキーがどの position として認識されているか」を
    # DYA Studio 上で確認できるようにするためのもの
    - name: zmk-feature-input-stream
      remote: cormoran
      revision: aeb015908a42a7615ccdccc7feb3a10d23132a71
    - name: zmk-feature-device-info
      remote: cormoran
      revision: 8cedd2dd9f04e19ea5a17b94914dd47a09d8db11
    - name: zmk-feature-kscan-diagnostics
      remote: cormoran
      revision: 1432f7fe0cfe903cd7d3c9931ae6bd6f2e1f328e

    # 接続先ごとの既定レイヤー。
    # main 側にはビヘイビア（&df）しか無く Studio RPC が入っていないため、
    # DYA Studio の Connection タブから設定するには custom-rpc-rewrite の
    # 方が必要（cormoran 氏自身も dya2 でこちらを使っている）。
    # ブランチ名のとおり作業中の系統なので SHA で固定する。
    # なお import: true は使わない。このモジュールの west 依存が
    # custom-settings を main で参照しており、上で SHA 固定している
    # ものと衝突するため（west update がエラーになる）
    - name: zmk-feature-default-layer
      remote: cormoran
      # codex/custom-rpc-rewrite @ 2026-07-15
      revision: b25cb5b324da2d9bbc84e1877c775f5b2b7c6845
    # default-layer の zephyr/module.yml が build.depends で os-detection を
    # 要求するため、機能を使わなくてもモジュールを置いておく必要がある
    # （無いと「Unmet or cyclic dependencies in modules」で configure が
    # 止まる）。CONFIG_ZMK_OS_DETECTION は無効なのでコードは入らない
    - name: zmk-feature-os-detection
      remote: cormoran
      # main @ 2026-07-19
      revision: 3052679f645b8fc1997275c2eaa6b86bdd55ca01

    # ハングやフォールトの記録と自動復帰
    - name: zmk-feature-watchdog
      remote: cormoran
      revision: 84ad14c6c3645dc40b23f45d08ab45418655f912

    # DYA Studio のキーマップ読み込みを速くする
    - name: zmk-feature-fast-keymap
      remote: cormoran
      revision: 8dac76de0ba38588ba39ca498910e24f8332bc6b
    # プレビューにトラックボールを描く（CLine46_R.overlay のノード参照）
    - name: zmk-feature-module-physical-layout
      remote: cormoran
      revision: 4f18de45dc27820725d267916b4cdacc0e0b6cf9

    # その他のモジュール
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
  self:
    path: config
