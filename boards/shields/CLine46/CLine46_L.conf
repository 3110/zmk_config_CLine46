#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
# 4.1 で電池残量の取得方法を選べるようになった。非LiPo モジュールが
# 出す残量%をそのまま使うため state-of-charge を指定する
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

##for NiMH battery
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# optional
CONFIG_ZMK_NON_LIPO_MAX_MV=1360
CONFIG_ZMK_NON_LIPO_MIN_MV=1020
CONFIG_ZMK_NON_LIPO_LOW_MV=1000
#CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# 60 seconds


# ========================================
# DYA Studio 用の設定（Peripheral 側）
# ========================================
# バッテリー履歴（Peripheral 側）
CONFIG_ZMK_BATTERY_HISTORY=n

# Settings RPC（Peripheral 側）
CONFIG_ZMK_SETTINGS_RPC=y

# Split イベントリレー（Peripheral 側）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# Custom Settings（Peripheral 側）。Central から中継されてくる
# 設定の読み書きに必要。マクロ/コンボの判定自体は Central で行う。
# 上流の zmk4.1 対応ブランチは左手側からこの一式を削っているが、
# 削ると DYA Studio の Settings タブから左手のアイドル/スリープ設定を
# 触れなくなるため、こちらでは残している。
# CONFIG_MAIN_STACK_SIZE の理由は CLine46_R.conf のコメント参照
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Kscan Diagnostics は左手には入れていない。理由は CLine46_R.conf の
# CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=n のコメント参照

# Watchdog（Peripheral 側）。左手自身のフリーズ・フォールトを記録し、
# 右手経由の問い合わせ（ZMK_WATCHDOG_SPLIT_RELAY、split では既定 y）に
# 答えるために必要。左手が落ちる類の不具合はこれが無いと記録が残らない。
# Peripheral 側は ZMK_STUDIO 不要
CONFIG_ZMK_WATCHDOG=y

# 設定の永続化
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000