#Mouse config ---------------------
# cormoran 版ドライバ（Studio RPC 付き）に差し替えたので、Kconfig は
# CONFIG_PMW3610_*。badjeff 版の _ALT 付きではない。
# ここの値は工場出荷値の扱いで、DYA Studio で変えて保存した値の方が
# 起動時に上書きする（Trackball タブ → PMW3610 Drivers）
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_SWAP_XY=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=10
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=500
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
# REST3_DOWNSHIFT と FORCE_AWAKE はこのドライバには Kconfig が無い。
# 常時稼働は devicetree の force-awake プロパティか DYA Studio から指定する

CONFIG_PMW3610_SMART_ALGORITHM=y


#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
# 4.1 で電池残量の取得方法を選べるようになった。非LiPo モジュールが
# 出す残量%をそのまま使うため state-of-charge を指定する
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

##for NiMH battery
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# optional
CONFIG_ZMK_NON_LIPO_MAX_MV=1360
CONFIG_ZMK_NON_LIPO_MIN_MV=1020
CONFIG_ZMK_NON_LIPO_LOW_MV=1000 
#CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# 60 seconds


#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n


#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12


# ========================================
# ZMK Studio（必須ベース）
# ========================================
CONFIG_ZMK_STUDIO=y
# Zephyr 4.1 では CONSOLE が既定で有効になるが使っていないので落とす
CONFIG_CONSOLE=n
# CONFIG_ZMK_STUDIO_LOCKING=n
# 注意: CONFIG_ZMK_STUDIO_LOCKING=n を設定しないでください。
# Studio Locking は BLE 接続に必要なため、デフォルトの y を維持する必要があります。
# 詳細は「BLE 接続」セクションを参照。

# BLE 接続スロット（プロファイル + Peripheral + Studio）
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# BLE 経由で DYA Studio に繋ぐときの応答速度。
# 通常時は省電力のため BT_PERIPHERAL_PREF_LATENCY=30（ZMK 既定）で動くが、
# Studio の通知が有効な間だけこの値まで下げる要求が出る
# （zmk/app/src/studio/gatt_rpc_transport.c）。
# 既定の 10 だと、接続間隔 15ms（PREF_MIN/MAX_INT=12）と合わせて
# 15ms ×（10+1）= 165ms が 1 往復ごとにかかる。DYA Studio は接続後の
# getDeviceInfo + listCustomSubsystems を 5 秒以内に終える必要があり
# （react-zmk-studio の DEFAULT_CONNECT_TIMEOUT_MS）、サブシステムが
# 15 個ある構成（PMW3610 のドライバを含む）では間に合わずタイムアウトしていた。
# 0 にすると Studio 接続中は毎接続間隔（15ms）で応答できる。
# 効くのは Studio が繋がっている間だけなので、普段の電池持ちには影響しない
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=0


# ========================================
# DYA Studio 用の設定（Central 側）
# ========================================
# BLE 管理
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# バッテリー履歴（無効）
# DYA Studio 本体はこのサブシステムに対応しておらず、モジュールが申告する
# Web UI の URL は開発用サーバ(http://localhost:5173)がハードコードされて
# いるだけなので、記録しても見る手段が無い。fork 元の 4.1 対応ブランチでも
# 「保存が遅い問題が未解決」として無効にされている。
# 見たくなったら y に戻したうえで、モジュールの web/ を自分で
# npm run dev すること（https://github.com/cormoran/zmk-module-battery-history）
CONFIG_ZMK_BATTERY_HISTORY=n
#CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
# デフォルトでは USB 給電中はバッテリー履歴の記録がスキップされます。
# USB 接続中もバッテリー履歴を記録したい場合は n に設定してください。
#CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# Settings RPC（アイドル/スリープ設定）
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Split イベントリレー（Central <-> Peripheral 設定同期）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# PMW3610 のセンサー設定を DYA Studio から変更（Trackball タブの
# PMW3610 Drivers）。Troubleshooting ではセンサーの生画像と診断値も見られる。
# サブシステム全体がロック対象で、読むだけでも &studio_unlock が要る
# （WriteRegister で生レジスタを叩けるため。モジュールの README 参照）。
# 設定は custom-settings に "<項目>@ball" のキーで保存される
# （ball は CLine46_R.overlay の settings-id）
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
# フレーム取得用の静的バッファ。既定の 484（22x22 画素）を常に確保する。
# RAM が苦しくなったら減らす（そのぶん取れる画素数も減る）
#CONFIG_ZMK_PMW3610_STUDIO_RPC_FRAME_BUF_SIZE=484

# Runtime Input Processor（トラックボール設定を DYA Studio から変更）
# トラックボール/ポインティングデバイスがある場合のみ必要
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# Custom Settings（マクロ/コンボの保存先。両モジュールの依存）
# MAIN_STACK_SIZE はモジュール側が configdefault で 2048 に上げるが、
# 挙動を設定ファイル上で読めるようにするため明示しておく
# (settings_load() は起動時にメインスレッドで走り、保存済みの設定があると
# 既定の 1024 バイトでは USB 列挙前に溢れて落ちる)
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# Runtime Macro（DYA Studio の Macro&Combo タブ）
# &rmacro <slot> の slot はマクロ作成時に割り当てられる番号。
# キーへの割り当ては DYA Studio のキーマップエディタからできる
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# マクロは手順をビヘイビアの local ID で保存するため、ID の生成方法を固定する
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

# Runtime Combo（同上）。既定のコンボは .keymap の
# cormoran,runtime-combo-defaults ノードで定義している
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# Input Stream（押下キーを DYA Studio 上でリアルタイム表示）
# 「押したキーがどの position として認識されているか」が見えるので、
# キーが効かないときの切り分けが楽になる
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# Device Info（FW のビルド情報・稼働時間を Troubleshooting タブに表示）
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# Kscan Diagnostics（チャタリング診断）
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
# 左手側への中継は切っている。ファーム側の中継（QueryPeripheral /
# PeripheralEvent）は完成しているが、それを表示する Web UI 側が未実装で、
# DYA Studio でも左手の配線情報は出ない（モジュールの README 参照）。
# 打鍵・チャタリングの統計は位置イベントが Central に届くので左手の分も
# 元から取れており、中継が無くても診断の実用面は落ちない。
# 有効にすると中継用スレッド（既定 4096 バイト）と、左手にも
# CONFIG_ZMK_KSCAN_DIAGNOSTICS=y、左右とも RELAY_EVENT_DATA_LEN=256 が要る。
# UI が対応したらこの行を消して、その3点を戻すこと
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=n

# Default Layer（接続先ごとに既定レイヤーを変える）
# MIN〜MAX が「既定レイヤーの候補」になり、ある候補を既定にすると
# 他の候補は無効化される。レイヤー0は ZMK の仕様で常に有効。
# 候補に 1〜3（SYMBOL/MOUSE/SCROLL）も入るが、これらはホールドで使う
# モーメンタリなので既定に選ばないこと。接続先ごとの差分は
# 予約してある 4〜6 に置くのが本来の使い方
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=6
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
# OS ごとの既定レイヤー
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# OS 判別。USB は列挙時のやり取り、BLE は GATT の読まれ方の癖から推定する。
# 推定結果と手動での上書きは DYA Studio の Connection タブで見られる。
# 判別が確定するのは接続のたびに USB=200ms / BLE=1000ms 静まってから
# （_SETTLE_MS）なので、繋いだ直後の一瞬は unknown 扱いになる。
# ZMK_OS_DETECTION_LAYER_AUTO_SWITCH は使わないこと。こちらの
# default-layer と両方がレイヤーを取り合う（モジュールの README にも注意書きあり）
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y

# Watchdog（フリーズ・フォールトを記録して自動再起動）
# 既定でシステムワークキューと低優先度ワークキューを監視し、
# 10秒（FREEZE_TIMEOUT_MS）止まったら記録して再起動する。
# ハードフォールト時も、停止しっぱなしにせず記録してから再起動する。
# 記録は Troubleshooting タブで読める。
# BLE の無線タイミングと稀に干渉しうる点がモジュール側の DESIGN.md に
# 書かれており、その場合は FREEZE_FEED_DIVISOR を上げるか
# FREEZE_MONITOR_LOWPRIO_QUEUE=n でタイマー負荷を減らす
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# Fast Keymap（DYA Studio のキーマップ読み込みを速くする）
# DEFAULT_LAYER はコンパイル時のキーマップと編集差分を分けて返す仕組みで、
# ブラウザ側が既定値をキャッシュして差分だけ取れるようになる。
# ZMK 本体に cormoran fork の拡張が要るが main+dya なので使える
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# Physical Layout（プレビューにトラックボールを描く）
# 有効にするだけでは何も出ない。位置と大きさは CLine46_R.overlay の
# trackball_layout ノードで指定している
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

# Custom Studio Protocol のモジュールを複数有効にするとスタック不足で
# クラッシュすることがあるため、DYA Studio 開発者ガイドの推奨値を入れている。
# メモリが足りなくなったら実機で確認しながら小さくすること
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# ========================================
# ステータスブロードキャスト（M5Stack などへ）
# ========================================
# レイヤー・電池・接続状態などを BLE の非接続広告に載せて流す。
# 受信側はスキャンするだけでよく、接続もペアリングも不要なので
# BLE プロファイル（5個）も BT_MAX_CONN も消費しない。
# ZMK 自身の広告（プロファイル用と Studio の directed advertising）と
# 衝突させないため、拡張広告のセットを別に1つ使う
# （Kconfig 側で CONFIG_BT_EXT_ADV と BT_EXT_ADV_MAX_ADV_SET=2 を面倒みる）。
# ペイロードの定義は include/cline46/status_adv.h、
# バイト配置の説明は docs/status-advertisement.md
CONFIG_CLINE46_STATUS_ADV=y
# 操作中の広告間隔。短いほど表示の追従は良いが電池を食う
CONFIG_CLINE46_STATUS_ADV_INTERVAL_MS=1000
# アイドル中（CONFIG_ZMK_IDLE_TIMEOUT 経過後）の広告間隔。
# ディープスリープに入ったら広告そのものを止める
CONFIG_CLINE46_STATUS_ADV_IDLE_INTERVAL_MS=10000
# 左手の電池電圧を受け取って広告に載せる（左手側にも同じ行が要る）。
# ZMK の split は残量(%)しか運ばないため、独自のイベント中継を使っている
CONFIG_CLINE46_STATUS_PERIPHERAL_VOLTAGE=y

# 設定の永続化
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

